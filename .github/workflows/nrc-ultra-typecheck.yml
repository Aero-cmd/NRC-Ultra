name: NRC Ultra typecheck

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc --noEmit
